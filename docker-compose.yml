name: tradebook

# Build step 1: SQL Server and the API only. Keycloak joins in step 7.
#
# The SA password is a development credential. Override it with
# MSSQL_SA_PASSWORD in the environment or a .env file if you want a different
# one; the default keeps `docker compose up` working with zero setup.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-TradeBook_Dev2026}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # $$ stops compose from interpolating the variable; the shell inside the
      # container expands it instead. -C trusts the self-signed certificate.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/TradeBook.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Double underscore is how environment variables express the ':'
      # hierarchy of appsettings.json (ConnectionStrings:TradeBook).
      ConnectionStrings__TradeBook: "Server=sqlserver,1433;Database=TradeBook;User Id=sa;Password=${MSSQL_SA_PASSWORD:-TradeBook_Dev2026};Encrypt=True;TrustServerCertificate=True"
      # The API creates the database and applies pending migrations when it
      # starts (ADR-008), so a fresh volume produces a working schema.
      Database__MigrateOnStartup: "true"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sqlserver-data:
